name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_DB: repomind
          POSTGRES_USER: repomind
          POSTGRES_PASSWORD: repomind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repomind -d repomind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://repomind:repomind@127.0.0.1:5432/repomind
      REPOMIND_TEST_DATABASE_URL: postgresql+psycopg://repomind:repomind@127.0.0.1:5432/repomind
      REDIS_TEST_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked Python dependencies
        run: uv sync --locked --all-groups
      - name: Check lockfile
        run: uv lock --check
      - name: Migrate test database
        run: uv run alembic upgrade head
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
