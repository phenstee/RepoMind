[project]
name = "repomind"
version = "0.1.0"
description = "RepoMind: an autonomous AI software engineer for understanding and modifying codebases"
readme = "README.md"
authors = [
    { name = "Stephen Chen", email = "yifeic2007@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.8.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[project.scripts]
repomind = "repomind:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]
