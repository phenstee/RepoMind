[project]
name = "repomind"
version = "0.1.0"
description = "RepoMind: an autonomous AI software engineer for understanding and modifying codebases"
readme = "README.md"
authors = [
    { name = "Stephen Chen", email = "yifeic2007@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.2",
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "openai>=3.8.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.53.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "postgres: requires a real PostgreSQL database with the pgvector extension",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]
